[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "textcli-loader"
version = "0.1.1"
description = "Zero-dependency text-cli instruction package loader — load and execute text-cli packages in any Python environment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/text-cli/text-cli"
Repository = "https://github.com/text-cli/text-cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["textcli_loader*"]
