# =========================================================================
# text-cli A9-advanced 融合镜像（copilot + service + MCP bridge + aggregate）
# -------------------------------------------------------------------------
# 重要前置（二次整合部署）：
#   本目录只是容器「元文件层」（Dockerfile/entrypoint/init_config），
#   真实运行时代码来自 deploy/A9-advanced，由 build.py 重排成构建上下文：
#
#       cd deploy/skeleton-container
#       python build.py            # 生成 .build/advanced/（构建上下文）
#       docker compose up -d       # 用下方 context 构建并启动
#
#   compose 的 build.context 指向 build.py 生成的 .build/advanced，
#   该目录不存在时请先运行上面的 build.py。
# -------------------------------------------------------------------------
# 薄沙箱全外挂（方案定型）：代码/包/数据全部外挂宿主机，镜像只含 Python 环境+seed。
#   runtime/   首次由 entrypoint 从 seed 填充，之后宿主托管（热更新/代码版本）
#   data/      sqlite 等持久数据，重建不丢
#   packages/  指令包源（TEXT_CLI_PACKAGE_SOURCE_DIRS 指向）
#   env 对齐 entrypoint 的 RUNTIME_DIR / SEED_DIR。
# 端口：28050(service) + 9020(MCP bridge)；copilot 20260 绑 127.0.0.1，不对外映射（红线）。
# =========================================================================
version: '3.8'

services:
  text-cli:
    # 构建上下文 = build.py 生成的 .build/advanced（含 service/copilot/MCPservice/A8-discovery + Dockerfile）
    build:
      context: ../.build/advanced
      dockerfile: Dockerfile
    image: text-cli-advanced:local
    ports:
      - "28050:28050"    # service（能力面）
      - "9020:9020"      # MCP bridge（MCP 协议面）
      # 20260 不映射（copilot 绑 127.0.0.1，仅本机回环可达，红线不暴露）
    volumes:
      # 全外挂：代码/数据/包源（首次 runtime 空由 entrypoint 从 seed 填充）
      - ./runtime:/app/runtime
      - ./data:/app/data
      - ./packages:/packages
    environment:
      - PORT=28050
      - MCP_PORT=9020
      - RUNTIME_DIR=/app/runtime
      - SEED_DIR=/app/seed
      - TEXT_CLI_PACKAGE_SOURCE_DIRS=/packages
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      - COPILOT_ENABLED=true
      - MCP_ENABLED=true
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:28050/text-cli/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
