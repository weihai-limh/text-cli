# =========================================================================
# text-cli A3-service 单运行时镜像（0.0.0.0:28050）
# -------------------------------------------------------------------------
# 前置（二次整合部署）：
#   cd deploy/skeleton-container
#   python build.py            # 生成 .build/service/（构建上下文）
#   docker compose up -d       # 用下方 context 构建并启动
#
#   compose 的 build.context 指向 build.py 生成的 .build/service，
#   该目录不存在时请先运行上面的 build.py。
# =========================================================================
version: '3.8'

services:
  text-cli-skill:
    build:
      context: ../.build/service
      dockerfile: Dockerfile
    image: text-cli-service:local
    ports:
      - "28050:28050"
    # 配置已随镜像 baked 进 /app/config（A3 单镜像布局），不要挂空目录覆盖！
    # 如需覆盖，挂载【已存在】的目录，例如：
    #   - /abs/path/to/my-service-config:/app/config
    environment:
      - SERVICE_TOKEN=${SERVICE_TOKEN:-test-token}
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:28050/text-cli/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
