# =========================================================================
# text-cli A3-service 单运行时镜像（0.0.0.0:28050）
# -------------------------------------------------------------------------
# 前置（二次整合部署）：
#   cd deploy/skeleton-container
#   python build.py            # 生成 .build/service/（构建上下文）
#   docker compose up -d       # 用下方 context 构建并启动
#
#   compose 的 build.context 指向 build.py 生成的 .build/service，
#   该目录不存在时请先运行上面的 build.py。
# -------------------------------------------------------------------------
# 薄沙箱全外挂（统一方案）：代码/数据外挂宿主机，镜像只含 Python 环境+seed。
#   runtime/   首次由 entrypoint 从 seed 填充，之后宿主托管
#   data/      sqlite 等持久数据，重建不丢
#   packages/  指令包源（可选，挂载后 TEXT_CLI_PACKAGE_SOURCE_DIRS 可用 install）
# 端口：28050(service)。A3 单运行时不含 copilot/MCP。
# =========================================================================
version: '3.8'

services:
  text-cli-skill:
    build:
      context: ../.build/service
      dockerfile: Dockerfile
    image: text-cli-service:local
    ports:
      - "28050:28050"
    volumes:
      - ./runtime:/app/runtime
      - ./data:/app/data
      - ./packages:/packages
    environment:
      - PORT=28050
      - RUNTIME_DIR=/app/runtime
      - SEED_DIR=/app/seed
      - TEXT_CLI_PACKAGE_SOURCE_DIRS=/packages
      - SERVICE_TOKEN=${SERVICE_TOKEN:-}
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:28050/text-cli/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
